<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060910">
<title>AI Studio Ultimate v8.0 — Chat + Imagem + Vídeo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<style>
:root {
  --bg-0: #060910; --bg-1: #0a0f1c; --bg-2: #0f1626;
  --surface-0: rgba(15, 22, 38, 0.78); --surface-2: rgba(30, 41, 59, 0.86);
  --border-0: rgba(148, 163, 184, 0.08); --border-1: rgba(148, 163, 184, 0.14); --border-2: rgba(148, 163, 184, 0.24);
  --accent: #38bdf8; --accent-2: #a855f7; --accent-3: #22d3ee;
  --accent-glow: rgba(56, 189, 248, 0.32);
  --success: #22c55e; --error: #ef4444; --warn: #f59e0b;
  --text-0: #f1f5f9; --text-1: #cbd5e1; --text-2: #94a3b8; --text-3: #64748b; --text-4: #475569;
  --bubble-user: linear-gradient(135deg, #0ea5e9 0%, #0284c7 45%, #075985 100%);
  --bubble-user-shadow: 0 12px 32px rgba(2, 132, 199, 0.35);
  --bubble-bot: rgba(23, 33, 51, 0.82);
  --bubble-bot-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  --code-bg: #04070e; --code-border: rgba(56, 189, 248, 0.14); --code-text: #dbeafe;
  --radius-sm: 10px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 26px; --radius-full: 9999px;
  --ease: cubic-bezier(0.16, 1, 0.3, 1); --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
body { font-family: var(--font-sans); font-size: 15px; color: var(--text-0); background: var(--bg-0); line-height: 1.55; display: flex; flex-direction: column; position: fixed; inset: 0; width: 100%; isolation: isolate; -webkit-font-smoothing: antialiased; }

.bg-layer { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
.bg-layer::after { content: ""; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(148,163,184,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,0.05) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 10%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 10%, transparent 80%); }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; will-change: transform; }
.blob.b1 { width: 46vw; height: 46vw; min-width: 320px; min-height: 320px; background: radial-gradient(circle, #0284c7, transparent 68%); top: -14%; left: -12%; animation: drift1 24s ease-in-out infinite alternate; }
.blob.b2 { width: 42vw; height: 42vw; min-width: 300px; min-height: 300px; background: radial-gradient(circle, #7c3aed, transparent 68%); top: -8%; right: -14%; animation: drift2 28s ease-in-out infinite alternate; }
.blob.b3 { width: 44vw; height: 44vw; min-width: 300px; min-height: 300px; background: radial-gradient(circle, #0d9488, transparent 68%); bottom: -22%; left: 26%; opacity: 0.32; animation: drift3 32s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate3d(10vw, 8vh, 0) scale(1.2); } }
@keyframes drift2 { to { transform: translate3d(-9vw, 11vh, 0) scale(1.15); } }
@keyframes drift3 { to { transform: translate3d(7vw, -9vh, 0) scale(1.25); } }

#progress-bar { position: fixed; top: 0; left: 0; height: 2.5px; width: 0%;
  background: linear-gradient(90deg, #38bdf8, #a855f7, #22d3ee, #f472b6, #38bdf8);
  background-size: 200% 100%; box-shadow: 0 0 12px rgba(56,189,248,.9);
  z-index: 3000; opacity: 0; transition: width .4s var(--ease), opacity .3s;
  border-radius: 0 3px 3px 0; animation: progressFlow 2s linear infinite; }
#progress-bar.active { opacity: 1; }
@keyframes progressFlow { to { background-position: 200% 0; } }

header { background: linear-gradient(180deg, rgba(15,22,38,.9), rgba(10,15,28,.75));
  backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
  padding: 12px 16px 10px; display: flex; flex-direction: column; gap: 10px;
  border-bottom: 1px solid var(--border-1); z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,.32);
  animation: headerIn .6s var(--ease) both; flex-shrink: 0; position: relative; }
@keyframes headerIn { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: translateY(0); } }
.header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.brand { font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
  background: linear-gradient(140deg, rgba(56,189,248,.22), rgba(168,85,247,.22));
  border: 1px solid rgba(56,189,248,.35);
  box-shadow: 0 0 22px rgba(56,189,248,.28), inset 0 0 14px rgba(56,189,248,.12);
  position: relative; overflow: hidden; flex-shrink: 0; }
.brand-logo::after { content: ""; position: absolute; inset: -60%;
  background: conic-gradient(from 0deg, transparent 0 62%, rgba(56,189,248,.55) 78%, transparent 92%);
  animation: spin 4.5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.brand-logo svg { position: relative; z-index: 1; width: 22px; height: 22px; }
.brand-text { background: linear-gradient(100deg, #f8fafc 15%, #7dd3fc 55%, #c4b5fd 92%);
  -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; }
.brand-badge { background: linear-gradient(135deg, rgba(56,189,248,.18), rgba(168,85,247,.18));
  color: #7dd3fc; padding: 3px 9px; border-radius: 999px; font-size: .62rem; font-weight: 800;
  letter-spacing: .06em; border: 1px solid rgba(56,189,248,.4); text-transform: uppercase;
  display: inline-flex; align-items: center; gap: 5px; }
.brand-badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: blink 2s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

.header-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select, input[type="password"], input[type="text"] {
  background: rgba(10,16,28,.88); color: var(--text-0);
  border: 1px solid var(--border-1); padding: 10px 14px;
  border-radius: var(--radius-lg); outline: none; font-size: .85rem;
  transition: all .25s var(--ease); user-select: text; font-family: inherit; cursor: pointer;
  appearance: none; -webkit-appearance: none; }
select option { background: #0d1526; color: var(--text-0); padding: 8px; }
select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.model-wrap { flex: 1; position: relative; min-width: 160px; }
.model-wrap select { width: 100%; padding-right: 42px; }
.provider-wrap { position: relative; min-width: 128px; }
.provider-wrap select { width: 100%; font-weight: 700; }
.new-flag { position: absolute; top: -6px; right: 10px;
  background: linear-gradient(135deg, #f472b6, #ec4899); color: #fff;
  font-size: .5rem; font-weight: 900; padding: 2px 6px; border-radius: 999px;
  letter-spacing: .08em; box-shadow: 0 4px 10px rgba(236,72,153,.5);
  pointer-events: none; animation: newPop 2.4s ease-in-out infinite; z-index: 2; }
@keyframes newPop { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.12) rotate(-5deg); } }

#api-panel { display: none; background: rgba(10,16,28,.94); padding: 12px;
  border-radius: var(--radius-lg); border: 1px solid var(--border-1);
  flex-direction: column; gap: 8px; animation: slideDown .35s var(--ease); }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.api-inputs-row { display: flex; gap: 8px; }
.status-badge { font-size: .75rem; padding: 5px 10px; border-radius: var(--radius-sm); display: inline-block; animation: slideDown .3s var(--ease); }
.status-badge.valid { background: rgba(34,197,94,.2); color: var(--success); }
.status-badge.invalid { background: rgba(239,68,68,.2); color: var(--error); }
.status-badge.warn { background: rgba(245,158,11,.2); color: var(--warn); }

/* MODE TABS */
.mode-tabs { display: flex; gap: 6px; padding: 4px; background: rgba(10,16,28,.6);
  border-radius: var(--radius-lg); border: 1px solid var(--border-1); }
.mode-tab { flex: 1; padding: 9px 12px; border-radius: var(--radius-md); border: none;
  background: transparent; color: var(--text-3); font-size: .8rem; font-weight: 700;
  cursor: pointer; transition: all .25s var(--ease); font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.mode-tab svg { flex-shrink: 0; }
.mode-tab:hover { background: rgba(56,189,248,.08); color: var(--text-1); }
.mode-tab.active { background: linear-gradient(135deg, rgba(56,189,248,.2), rgba(168,85,247,.15));
  color: #bae6fd; box-shadow: 0 2px 10px rgba(56,189,248,.15); }
.mode-tab .tab-badge { font-size: .55rem; background: rgba(34,197,94,.25); color: #4ade80;
  padding: 1px 5px; border-radius: 999px; font-weight: 800; margin-left: 2px; }

#chat-box { flex: 1; padding: 20px 16px 8px; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 1;
  scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.25) transparent;
  -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain;
  contain: layout style paint; }
#chat-box::-webkit-scrollbar { width: 7px; }
#chat-box::-webkit-scrollbar-thumb { background: rgba(148,163,184,.22); border-radius: 999px; }
#chat-box::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,.5); }

.welcome { display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 18px; padding: 30px 16px 40px; margin: auto 0; animation: fadeUp .7s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
.welcome-orb { width: 100px; height: 100px; border-radius: 30px; display: grid; place-items: center;
  background: linear-gradient(140deg, rgba(56,189,248,.2), rgba(168,85,247,.2));
  border: 1px solid rgba(56,189,248,.36);
  box-shadow: 0 0 55px rgba(56,189,248,.35), inset 0 0 28px rgba(56,189,248,.12);
  position: relative; animation: float 4.5s ease-in-out infinite; }
.welcome-orb svg { width: 52px; height: 52px; color: #ffffff; }
.welcome-orb::before, .welcome-orb::after { content: ""; position: absolute; inset: -12px; border-radius: 38px;
  border: 1px solid rgba(56,189,248,.22); animation: pulseRing 3.2s ease-out infinite; }
.welcome-orb::after { animation-delay: 1.6s; }
@keyframes pulseRing { 0% { transform: scale(.88); opacity: .9; } 100% { transform: scale(1.32); opacity: 0; } }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
.welcome h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.15;
  background: linear-gradient(100deg, #f8fafc 10%, #7dd3fc 50%, #c4b5fd 85%, #f472b6);
  background-size: 200% 100%; -webkit-background-clip: text; background-clip: text;
  color: transparent; animation: gradientFlow 6s ease infinite; }
@keyframes gradientFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.welcome p { color: var(--text-2); font-size: .9rem; max-width: 440px; line-height: 1.6; }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; width: 100%; max-width: 560px; margin-top: 4px; }
.chip { display: flex; align-items: center; gap: 12px; padding: 13px 15px;
  border-radius: var(--radius-lg); background: rgba(30,41,59,.72);
  border: 1px solid var(--border-1); color: var(--text-0);
  font-size: .82rem; font-weight: 600; cursor: pointer;
  transition: all .3s var(--ease); text-align: left; font-family: inherit;
  position: relative; overflow: hidden; animation: chipIn .55s var(--ease) both; }
.chip:hover { border-color: rgba(56,189,248,.55); transform: translateY(-3px); box-shadow: 0 12px 26px rgba(56,189,248,.18); }
@keyframes chipIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.chip-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  background: linear-gradient(140deg, rgba(56,189,248,.2), rgba(168,85,247,.2));
  border: 1px solid rgba(56,189,248,.32); color: #7dd3fc; flex-shrink: 0; }
.chip-icon svg { width: 16px; height: 16px; }

.message-row { display: flex; gap: 10px; max-width: 94%;
  animation: popIn .42s var(--ease-spring) both; position: relative; }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
.message-row.user { align-self: flex-end; flex-direction: row-reverse; max-width: 90%; }
.message-row.bot { align-self: flex-start; width: 100%; max-width: 100%; }
.avatar { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
  flex-shrink: 0; margin-top: 2px; border: 1px solid var(--border-1);
  position: relative; overflow: hidden; }
.avatar svg { width: 18px; height: 18px; position: relative; z-index: 1; }
.user .avatar { background: linear-gradient(140deg, rgba(34,197,94,.2), rgba(56,189,248,.2)); color: #86efac; }
.bot .avatar { background: linear-gradient(140deg, rgba(56,189,248,.18), rgba(168,85,247,.18));
  color: #ffffff; box-shadow: 0 0 16px rgba(56,189,248,.24); }
.bot .avatar::after { content: ""; position: absolute; inset: -30%;
  background: conic-gradient(from 0deg, transparent 0 70%, rgba(56,189,248,.5) 85%, transparent 95%);
  animation: spin 3.5s linear infinite; pointer-events: none; }
.message-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.user .message-body { align-items: flex-end; }
.message-bubble { padding: 15px 19px; border-radius: var(--radius-xl); line-height: 1.65;
  font-size: .94rem; word-break: break-word; box-shadow: 0 8px 24px rgba(0,0,0,.28);
  user-select: text; min-width: 0; max-width: 100%; }
.user .message-bubble { background: var(--bubble-user); color: #fff; border-bottom-right-radius: 6px;
  box-shadow: var(--bubble-user-shadow); }
.bot .message-bubble { background: var(--bubble-bot); border: 1px solid var(--border-1);
  border-bottom-left-radius: 6px; backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px); flex: 1; box-shadow: var(--bubble-bot-shadow); }
.bot.error .message-bubble { border-color: rgba(239,68,68,.45); background: rgba(69,26,26,.5); color: #fecaca; }
.message-bubble code:not(pre code) { background: rgba(56,189,248,.13); color: #7dd3fc; padding: 2px 6px;
  border-radius: 5px; font-family: var(--font-mono); font-size: .88em; }

.thinking-container { display: flex; align-items: center; gap: 11px;
  color: var(--text-2); font-size: .88rem; font-weight: 500; }
.brain-icon { width: 22px; height: 22px; fill: none; stroke: var(--accent); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
  animation: brainPulse 1.6s infinite ease-in-out; flex-shrink: 0; }
@keyframes brainPulse { 0%,100% { opacity: .3; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 10px var(--accent)); } }
.typing-dots { display: inline-flex; gap: 4px; align-items: center; }
.typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  display: block; box-shadow: 0 0 10px rgba(56,189,248,.7); animation: dotBounce 1.3s infinite ease-in-out; }
.typing-dots i:nth-child(2) { animation-delay: .18s; }
.typing-dots i:nth-child(3) { animation-delay: .36s; }
@keyframes dotBounce { 0%,60%,100% { transform: translateY(0) scale(.85); opacity: .4; } 30% { transform: translateY(-7px) scale(1.15); opacity: 1; } }

.reasoning-box { margin-bottom: 10px; border-radius: var(--radius-md);
  border: 1px solid rgba(56,189,248,.22);
  background: linear-gradient(135deg, rgba(56,189,248,.06), rgba(168,85,247,.06));
  overflow: hidden; animation: fadeUp .4s var(--ease) both; }
.reasoning-header { display: flex; align-items: center; gap: 8px; padding: 9px 13px;
  cursor: pointer; user-select: none; transition: background .2s; }
.reasoning-header:hover { background: rgba(56,189,248,.06); }
.reasoning-header svg { color: #7dd3fc; flex-shrink: 0; transition: transform .3s var(--ease); }
.reasoning-header.collapsed svg { transform: rotate(-90deg); }
.reasoning-title { font-size: .78rem; font-weight: 700; color: #7dd3fc; letter-spacing: .03em; display: inline-flex; align-items: center; gap: 6px; }
.reasoning-body { padding: 0 13px 12px; font-size: .82rem; line-height: 1.6;
  color: var(--text-2); font-style: italic;
  max-height: 400px; overflow-y: auto; transition: max-height .4s var(--ease), padding .3s; }
.reasoning-body.collapsed { max-height: 0; padding: 0 13px; overflow: hidden; }
.reasoning-cursor { display: inline-block; width: 2px; height: 1em; background: #7dd3fc;
  vertical-align: text-bottom; margin-left: 2px;
  animation: cursorBlink 1s step-end infinite; box-shadow: 0 0 6px #7dd3fc; }
@keyframes cursorBlink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

.code-container { margin: 14px 0; background: var(--code-bg); border: 1px solid var(--code-border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: inset 0 0 50px rgba(0,0,0,.4); animation: fadeUp .4s var(--ease) both; }
.code-container.streaming { opacity: 0.96; }
.code-header { background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.015));
  padding: 8px 10px 8px 14px; display: flex; justify-content: space-between;
  align-items: center; gap: 8px; border-bottom: 1px solid var(--border-1);
  font-family: var(--font-mono); font-size: .78rem; color: var(--text-2); flex-wrap: wrap; }
.lang-tag { display: inline-flex; align-items: center; gap: 7px;
  text-transform: uppercase; letter-spacing: .08em; font-weight: 700;
  font-size: .66rem; color: #7dd3fc; font-family: var(--font-mono); }
.lang-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: linear-gradient(135deg, #38bdf8, #a855f7); box-shadow: 0 0 8px rgba(56,189,248,.7); }
.code-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.icon-btn { background: linear-gradient(135deg, rgba(30,41,59,.9), rgba(20,30,48,.9));
  border: 1px solid var(--border-2); color: var(--text-1);
  padding: 7px 14px; border-radius: var(--radius-md); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .76rem; font-weight: 600; transition: all .25s var(--ease);
  position: relative; overflow: hidden; white-space: nowrap;
  font-family: inherit; flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06); }
.icon-btn svg { flex-shrink: 0; transition: transform .25s var(--ease); }
.icon-btn:hover { background: linear-gradient(135deg, rgba(56,189,248,.14), rgba(168,85,247,.1));
  border-color: rgba(56,189,248,.6); color: #bae6fd;
  box-shadow: 0 6px 20px rgba(56,189,248,.22), inset 0 1px 0 rgba(255,255,255,.1);
  transform: translateY(-1px); }
.icon-btn:active { transform: translateY(0) scale(.96); }
.icon-btn:disabled { opacity: .45; pointer-events: none; }
.icon-btn.primary { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #04121f;
  font-weight: 700; border-color: transparent;
  box-shadow: 0 4px 16px rgba(56,189,248,.4), inset 0 1px 0 rgba(255,255,255,.3); }
.icon-btn.primary:hover { background: linear-gradient(135deg, #7dd3fc, #38bdf8); color: #04121f; }
.icon-btn.danger { background: linear-gradient(135deg, rgba(239,68,68,.15), rgba(185,28,28,.15));
  border-color: rgba(239,68,68,.4); color: #fca5a5; }
.icon-btn.danger:hover { background: linear-gradient(135deg, rgba(239,68,68,.25), rgba(185,28,28,.25));
  border-color: rgba(239,68,68,.7); color: #fecaca; }

pre { padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono);
  font-size: .84rem; color: var(--code-text); line-height: 1.6; user-select: text; tab-size: 2;
  background: transparent; margin: 0; }
pre code { background: transparent !important; padding: 0 !important; color: inherit; font-family: var(--font-mono); font-size: inherit; }
pre::-webkit-scrollbar { height: 7px; }
pre::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 999px; }

.img-wrap { position: relative; margin-top: 10px; border-radius: var(--radius-lg);
  overflow: hidden; border: 1px solid var(--border-1);
  background: linear-gradient(110deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
  background-size: 220% 100%; animation: shimmer 1.5s linear infinite; max-width: 440px; min-height: 200px; }
@keyframes shimmer { to { background-position: -220% 0; } }
.img-generated { width: 100%; display: block; opacity: 0;
  transition: opacity .7s var(--ease), transform .5s var(--ease); }
.img-generated.loaded { opacity: 1; animation: imgReveal .9s var(--ease) both; }
@keyframes imgReveal { from { transform: scale(1.06); filter: blur(8px); } to { transform: scale(1); filter: blur(0); } }

          <path d="M12 4.5a2.5 2.5 0 0 0-4.96-.46 2.5 2.5 0 0 0-1.98 3 2.5 2.5 0 0 0-1.32 4.24 2.5 2.5 0 0 0 .8 3.58 2.5 2.5 0 0 0 3.82 2.62 2.5 2.5 0 0 0 3.64.02V4.5z"/>

          <circle class="neuron" cx="15" cy="9" r="0.85"/>
          <circle class="neuron" cx="12" cy="14" r="0.85"/>
          <circle class="neuron" cx="10" cy="18" r="0.85"/>
        </svg>
      </div>
      <span class="brand-text">AI Studio</span>
      <span class="brand-badge">v8.0</span>
    </div>
    <button class="icon-btn" onclick="openTutorial()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="btn-label">Tutorial</span>
    </button>
  </div>

  <!-- MODE TABS -->
  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab active" data-mode="chat" onclick="setMode('chat')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      Chat
    </button>
    <button class="mode-tab" data-mode="image" onclick="setMode('image')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      Imagem
      <span class="tab-badge">8+</span>
    </button>
    <button class="mode-tab" data-mode="video" onclick="setMode('video')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Vídeo
      <span class="tab-badge">7+</span>
    </button>
  </div>

  <div class="header-controls" id="header-controls">
    <div class="provider-wrap" id="provider-wrap">
      <select id="provider-select" onchange="onProviderChange()">
        <option value="groq">Groq</option>
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
        <option value="openai">OpenAI</option>
        <option value="qwen">Qwen</option>
        <option value="openrouter">OpenRouter</option>
      </select>
    </div>
    <div class="model-wrap" id="model-wrap">
      <span class="new-flag" id="new-flag" style="display:none;">NEW</span>
      <select id="model-select" onchange="onModelChange()"></select>
    </div>
    <button class="icon-btn" onclick="toggleApiPanel()" id="key-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      <span class="btn-label">Chave</span>
    </button>
  </div>

  <div id="api-panel">
    <div class="api-inputs-row">
      <input type="password" id="custom-key" placeholder="Cole sua chave..." style="flex:1;">
      <button class="icon-btn primary" id="verify-btn" onclick="verifyCustomKey()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>

  </div>
</header>

<div id="chat-box"></div>

<div id="input-container">

<input type="file" id="file-input" multiple accept="image/*,text/*,application/pdf,.doc,.docx,.txt,.md,.json,.js,.py,.html,.css,.csv" style="display:none" onchange="handleFileSelect(event)">

<div id="app-modal" class="modal">
  <div class="modal-header">
    <div class="modal-title">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>

</div>

/* ============================================================
   MODE SWITCHER
   ============================================================ */
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll(".mode-tab").forEach(t => {
    t.classList.toggle("active", t.dataset.mode === mode);
  });

  const providerWrap = document.getElementById("provider-wrap");
  const modelWrap = document.getElementById("model-wrap");
  const keyBtn = document.getElementById("key-btn");

  if (mode === "chat") {
    providerWrap.style.display = "";
    modelWrap.style.display = "";
    keyBtn.style.display = "";
    rebuildModelSelect();
    document.getElementById("user-input").placeholder = "Digite uma mensagem...";
  } else if (mode === "image") {
    providerWrap.style.display = "none";
    keyBtn.style.display = "none";
    modelWrap.style.display = "";
    rebuildImageModelSelect();
    document.getElementById("user-input").placeholder = "Descreva a imagem que quer gerar...";
  } else if (mode === "video") {
    providerWrap.style.display = "none";
    keyBtn.style.display = "none";
    modelWrap.style.display = "";
    rebuildVideoModelSelect();
    document.getElementById("user-input").placeholder = "Descreva o vídeo que quer gerar...";
  }
  saveState();
}

function rebuildImageModelSelect() {
  modelSelect.innerHTML = "";
  IMAGE_MODELS.forEach(m => {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.name;
    modelSelect.appendChild(o);
  });
  modelSelect.value = selectedImageModel || "flux";
  document.getElementById("new-flag").style.display = "none";
}

function rebuildVideoModelSelect() {
  modelSelect.innerHTML = "";
  VIDEO_MODELS.forEach(m => {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.name;
    modelSelect.appendChild(o);
  });
  modelSelect.value = selectedVideoModel || "wan-2.7";
  document.getElementById("new-flag").style.display = "none";
}

/* ============================================================
   CHAT STORAGE
   ============================================================ */
function loadChats() {
  try {
    const raw = localStorage.getItem(STORAGE.chats);
    chats = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(chats)) chats = [];
  } catch (e) { chats = []; }
  currentChatId = localStorage.getItem(STORAGE.currentChat) || null;
  if (!chats.length) {
    const c = createChatData();
    chats.push(c);
    currentChatId = c.id;
    saveChats();
  }
  if (!currentChatId || !chats.find(c => c.id === currentChatId)) {
    currentChatId = chats[0].id;
    saveChats();
  }
}
function createChatData() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    title: "Nova conversa",
    messages: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}
function saveChats() {
  try {
    localStorage.setItem(STORAGE.chats, JSON.stringify(chats));
    if (currentChatId) localStorage.setItem(STORAGE.currentChat, currentChatId);
  } catch (e) { console.warn("Storage cheio ou bloqueado"); }
}
function getCurrentChat() {
  return chats.find(c => c.id === currentChatId) || null;
}
function createNewChat() {
  const c = createChatData();
  chats.unshift(c);
  currentChatId = c.id;
  saveChats();
  renderChatList();
  renderCurrentChat();
  closeSidebar();
  userInput.focus();
}
function switchChat(id) {
  if (id === currentChatId) { closeSidebar(); return; }
  currentChatId = id;
  saveChats();
  renderChatList();
  renderCurrentChat();
  closeSidebar();
}
function deleteChat(id) {
  if (!confirm("Apagar esta conversa?")) return;
  chats = chats.filter(c => c.id !== id);
  if (!chats.length) {
    const c = createChatData();
    chats.push(c);
    currentChatId = c.id;
  } else if (currentChatId === id) {
    currentChatId = chats[0].id;
  }
  saveChats();
  renderChatList();
  renderCurrentChat();
}
function addMessageToCurrentChat(msg) {
  const chat = getCurrentChat();
  if (!chat) return;
  chat.messages.push(msg);
  chat.updatedAt = Date.now();
  if (msg.role === "user" && chat.messages.filter(m => m.role === "user").length === 1) {
    chat.title = (msg.text || "Nova conversa").slice(0, 42).replace(/\n/g, " ") || "Nova conversa";
  }
  saveChats();
  renderChatList();
}
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sidebar-overlay").classList.toggle("open");
}
function closeSidebar() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sidebar-overlay").classList.remove("open");
}
function renderChatList() {
  const list = document.getElementById("chat-list");
  if (!chats.length) {
    list.innerHTML = '<div class="empty-chat-list">Nenhuma conversa ainda.<br>Toque em "Nova conversa" para começar.</div>';
    return;
  }
  list.innerHTML = chats.map(c => {
    const active = c.id === currentChatId ? "active" : "";
    const preview = c.messages.length ? c.messages[c.messages.length - 1].text.slice(0, 50) : "Vazia";
    const date = new Date(c.updatedAt);
    const dateStr = date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    return `<div class="chat-item ${active}" onclick="switchChat('${c.id}')">
      <div class="chat-item-info">
        <div class="chat-item-title">${escapeHtml(c.title)}</div>
        <div class="chat-item-meta">${escapeHtml(preview)} · ${dateStr}</div>
      </div>
      <button class="chat-item-del" onclick="event.stopPropagation();deleteChat('${c.id}')" title="Apagar">
        ${ICONS.x}
      </button>
    </div>`;
  }).join("");
}

function renderCurrentChat() {
  codeStorage = [];
  textStorage = [];
  const chat = getCurrentChat();
  chatBox.innerHTML = "";
  if (!chat || !chat.messages.length) {
    renderWelcome();
    return;
  }
  chat.messages.forEach(msg => {
    if (msg.role === "user") {
      appendUserMessageFromData(msg);
    } else {
      appendBotMessageFromData(msg);
    }
  });
  scrollChat(true);
}

function appendUserMessageFromData(msg) {
  const row = document.createElement("div");
  row.className = "message-row user";
  let attsHtml = "";
  if (msg.attachments && msg.attachments.length) {
    attsHtml = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;justify-content:flex-end;">';
    msg.attachments.forEach(a => {
      if (a.isImage) attsHtml += `<img src="${a.dataUrl}" style="max-width:160px;max-height:160px;border-radius:12px;border:1px solid rgba(255,255,255,.2);" alt="">`;
      else attsHtml += `<div style="padding:6px 10px;background:rgba(0,0,0,.2);border-radius:10px;font-size:.72rem;">${escapeHtml(a.name)}</div>`;
    });
    attsHtml += "</div>";
  }
  row.innerHTML = `<div class="avatar">${ICONS.user}</div><div class="message-body"><div class="message-bubble">${attsHtml}${escapeHtml(msg.text || "")}</div></div>`;
  chatBox.appendChild(row);
}

function appendBotMessageFromData(msg) {
  const row = document.createElement("div");
  row.className = "message-row bot";
  if (msg.isError) row.classList.add("error");
  row.innerHTML = `<div class="avatar">${ICONS.bot}</div><div class="message-body"><div class="message-bubble"></div></div>`;
  chatBox.appendChild(row);
  const bubble = row.querySelector(".message-bubble");

  if (msg.isImage && msg.imageUrl) {
    bubble.innerHTML = `
      <div class="img-wrap loaded" style="animation:none;background:transparent;min-height:auto;">
        <img src="${msg.imageUrl}" class="img-generated loaded" alt="Imagem">
        <div class="img-overlay">
          <button class="img-action" data-imgurl="${msg.imageUrl}" onclick="downloadImage(this.dataset.imgurl)" title="Baixar">${ICONS.download}</button>
          <a href="${msg.imageUrl}" target="_blank" class="img-action" title="Abrir">${ICONS.expand}</a>
        </div>
      </div>`;
  } else if (msg.isVideo && msg.videoUrl) {
    bubble.innerHTML = `
      <div class="video-wrap loaded" style="animation:none;background:transparent;min-height:auto;">
        <video src="${msg.videoUrl}" controls playsinline preload="metadata"></video>
        <div class="video-overlay">
          <button class="img-action" data-videourl="${msg.videoUrl}" onclick="downloadVideo(this.dataset.videourl)" title="Baixar">${ICONS.download}</button>
          <a href="${msg.videoUrl}" target="_blank" class="img-action" title="Abrir">${ICONS.expand}</a>
        </div>
      </div>`;
  } else {
    const answerEl = document.createElement("div");
    answerEl.innerHTML = buildFinalHTML(msg.text || "", false);
    bubble.appendChild(answerEl);
    applyHighlight(bubble);
  }
  if (msg.usage || msg.modelName) addMetaToBubble(bubble, msg.text || "", msg.usage, msg.modelName);
}

function loadState() {
  try {
    const k = localStorage.getItem(STORAGE.keys);
    if (k) state.keys = JSON.parse(k) || {};
    const p = localStorage.getItem(STORAGE.provider);
    if (p && PROVIDERS[p]) state.provider = p;
    const m = localStorage.getItem(STORAGE.model);
    if (m) state.model = m;
    const im = localStorage.getItem(STORAGE.imageModel);
    if (im) selectedImageModel = im;
    const vm = localStorage.getItem(STORAGE.videoModel);
    if (vm) selectedVideoModel = vm;
  } catch (e) {}
}
function saveState() {
  try {
    localStorage.setItem(STORAGE.keys, JSON.stringify(state.keys));
    localStorage.setItem(STORAGE.provider, state.provider);
    localStorage.setItem(STORAGE.model, state.model);
    localStorage.setItem(STORAGE.imageModel, selectedImageModel);
    localStorage.setItem(STORAGE.videoModel, selectedVideoModel);
  } catch (e) {}
}
function getActiveKey() {
  const custom = state.keys[state.provider];
  if (custom && custom.trim()) return custom.trim();
  return PROVIDERS[state.provider].defaultKey || "";
}
function getModelInfo(prov, model) {
  const p = PROVIDERS[prov];
  if (!p) return null;
  for (let i = 0; i < p.models.length; i++) if (p.models[i].id === model) return p.models[i];
  return null;
}
function getCurrentModelInfo() { return getModelInfo(state.provider, state.model); }

function onProviderChange() {
  state.provider = providerSelect.value;
  rebuildModelSelect();
  if (modelSelect.options.length) {
    state.model = modelSelect.options[0].value;
    modelSelect.value = state.model;
  }
  saveState();
  updateKeyUI();
  onModelChange();
}
function rebuildModelSelect() {
  const p = PROVIDERS[state.provider];
  if (!p) return;
  modelSelect.innerHTML = "";
  p.models.forEach(m => {
    const o = document.createElement("option");
    o.value = m.id;
    o.textContent = m.name;
    modelSelect.appendChild(o);
  });
}
function updateKeyUI() {
  const p = PROVIDERS[state.provider];
  const k = document.getElementById("custom-key");
  const st = document.getElementById("key-status-msg");
  if (!k || !st) return;
  k.placeholder = "Cole sua chave " + (p.placeholder || "") + "...";
  const saved = state.keys[state.provider];
  k.value = saved || "";
  if (saved) st.innerHTML = '<span class="status-badge valid">' + ICONS.checkCircle + ' Chave salva para ' + p.name + '</span>';
  else if (p.defaultKey) st.innerHTML = '<span class="status-badge warn">' + ICONS.info + ' Usando chave padrão</span>';
  else st.innerHTML = '<span class="status-badge warn">' + ICONS.alert + ' Sem chave configurada</span>';
}
function toggleApiPanel() {
  const apiPanel = document.getElementById("api-panel");
  apiPanel.style.display = apiPanel.style.display === "flex" ? "none" : "flex";
  if (apiPanel.style.display === "flex") updateKeyUI();
}
async function verifyCustomKey() {
  const p = PROVIDERS[state.provider];
  const input = document.getElementById("custom-key").value.trim();
  const statusMsg = document.getElementById("key-status-msg");
  const verifyBtn = document.getElementById("verify-btn");
  if (!input) { statusMsg.innerHTML = '<span class="status-badge invalid">' + ICONS.alert + ' Digite uma chave</span>'; return; }
  if (p.prefix && !input.startsWith(p.prefix)) {
    statusMsg.innerHTML = '<span class="status-badge invalid">' + ICONS.alert + ' Deve começar com ' + p.prefix + '</span>'; return;
  }
  verifyBtn.disabled = true;
  const original = verifyBtn.innerHTML;
  verifyBtn.innerHTML = 'Validando...';
  statusMsg.innerHTML = "";
  try {
    const ok = await testKey(input);
    if (ok) {
      state.keys[state.provider] = input;
      saveState();
      statusMsg.innerHTML = '<span class="status-badge valid">' + ICONS.checkCircle + ' Chave válida e salva!</span>';
      showToast("Chave validada para " + p.name, "success");
      setTimeout(() => { document.getElementById("api-panel").style.display = "none"; }, 1200);
    } else {
      statusMsg.innerHTML = '<span class="status-badge invalid">' + ICONS.alert + ' Chave rejeitada</span>';
    }
  } catch (e) {
    statusMsg.innerHTML = '<span class="status-badge invalid">' + ICONS.alert + ' ' + escapeHtml(e.message) + '</span>';
  } finally {
    verifyBtn.disabled = false;
    verifyBtn.innerHTML = original;
  }
}
async function testKey(key) {
  const p = PROVIDERS[state.provider];
  try {
    if (p.modelsUrl) {
      const url = p.modelsUrl.replace("{key}", key);
      const headers = p.headers(key);
      delete headers["Content-Type"];
      const res = await fetch(url, { headers });
      return res.ok;
    }
    if (state.provider === "claude") {
      const r = await fetch(p.url, { method: "POST", headers: p.headers(key), body: JSON.stringify({ model: p.models[0].id, max_tokens: 10, messages: [{ role: "user", content: "hi" }] }) });
      return r.ok;
    }
    return key.length > 10;
  } catch (e) { throw new Error("Erro de rede"); }
}

function showToast(msg, type) {
  type = type || "info";
  const c = document.getElementById("toast-container");
  const t = document.createElement("div");
  t.className = "toast " + type;
  const ic = type === "success" ? ICONS.checkCircle : type === "error" ? ICONS.alert : type === "warning" ? ICONS.alert : ICONS.info;
  t.innerHTML = ic + "<span>" + escapeHtml(msg) + "</span>";
  c.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 340); }, 2600);
}
let progressTimer = null;
function startProgress() {
  progressBar.classList.add("active");
  progressBar.style.width = "0%";
  let p = 0;
  clearInterval(progressTimer);
  progressTimer = setInterval(() => { p += Math.random() * 8; if (p > 90) p = 90; progressBar.style.width = p + "%"; }, 240);
}
function endProgress() {
  clearInterval(progressTimer);

let mediaRecorder = null;
let audioChunks = [];
async function toggleMic() {
  const micBtn = document.getElementById("mic-btn");
  if (mediaRecorder && mediaRecorder.state === "recording") { mediaRecorder.stop(); return; }
  if (state.provider !== "groq" && state.provider !== "openai") { showToast("Transcrição só disponível no Groq ou OpenAI", "warning"); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast("Gravação não suportada", "error"); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream, { mimeType: "audio/webm" });
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      micBtn.classList.remove("recording");
      micBtn.classList.add("transcribing");
      showToast("Transcrevendo áudio...", "info");
      const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
      await transcribeAudio(audioBlob);
      micBtn.classList.remove("transcribing");
    };
    mediaRecorder.start();
    micBtn.classList.add("recording");
    showToast("Gravando... toque no microfone para parar", "info");
  } catch (err) { showToast("Permissão de microfone negada", "error"); }
}
async function transcribeAudio(audioBlob) {
  const apiKey = getActiveKey();
  const p = PROVIDERS[state.provider];
  if (!p.transcribeUrl) { showToast("Provider não suporta transcrição", "warning"); return; }
  const formData = new FormData();
  formData.append("file", audioBlob, "gravacao.webm");
  formData.append("model", state.provider === "groq" ? "whisper-large-v3-turbo" : "whisper-1");
  formData.append("language", "pt");
  formData.append("response_format", "json");
  try {
    const res = await fetch(p.transcribeUrl, { method: "POST", headers: { "Authorization": `Bearer ${apiKey}` }, body: formData });
    if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error?.message || `Erro ${res.status}`); }
    const data = await res.json();
    if (data.text) { userInput.value = data.text; autoResize(); showToast("Transcrição concluída!", "success"); }
    else showToast("Nenhum texto detectado", "warning");
  } catch (err) { showToast("Erro na transcrição: " + err.message, "error"); }
}

async function sendMessage() {
  if (isGenerating) return;
  const text = userInput.value.trim();
  if (!text && attachments.length === 0) return;
  if (chatBox.querySelector(".welcome")) chatBox.innerHTML = "";

  const imgs = attachments.filter(a => a.isImage);
  const files = attachments.filter(a => !a.isImage);
  const info = getCurrentModelInfo();

  if (currentMode === "chat" && imgs.length > 0 && info && !info.vision) showToast("Modelo atual não vê imagens.", "warning");

  const attsCopy = attachments.slice();
  appendUserMessage(text, attsCopy);
  addMessageToCurrentChat({ role: "user", text, attachments: attsCopy, timestamp: Date.now() });
  userInput.value = "";
  autoResize();
  attachments = [];
  renderAttachments();

  userInput.disabled = true;
  sendBtn.disabled = true;
  isGenerating = true;

  startProgress();
  try {
    if (currentMode === "image") {
      await generateImage(text, selectedImageModel);
    } else if (currentMode === "video") {
      await generateVideo(text, selectedVideoModel);
    } else {
      const isImageReq = /\b(crie|gere|desenhe|gerar|faz|faça)\b.*\b(imagem|arte|foto|ilustra)/i.test(text) && imgs.length === 0;
      if (isImageReq) await generateImage(text, "flux");
      else await generateTextStream(text, imgs, files);
    }
  } catch (e) { console.error(e); }
  finally {
    endProgress();
    userInput.disabled = false;
    sendBtn.disabled = false;
    isGenerating = false;
    userInput.focus();
  }
}

function buildSegments(rawText) {
  const segs = [];
  let i = 0;
  while (i < rawText.length) {
    const start = rawText.indexOf("```", i);
    if (start === -1) { segs.push({ type: "text", content: rawText.slice(i) }); break; }
    if (start > i) segs.push({ type: "text", content: rawText.slice(i, start) });
    const afterStart = start + 3;
    const rest = rawText.slice(afterStart);
    const endIdx = rest.indexOf("```");
    if (endIdx === -1) {
      const nl = rest.indexOf("\n");
      if (nl === -1) segs.push({ type: "code", lang: rest.trim().slice(0, 20), content: "", incomplete: true });
      else segs.push({ type: "code", lang: rest.slice(0, nl).trim(), content: rest.slice(nl + 1), incomplete: true });
      break;
    }
    const body = rest.slice(0, endIdx);
    const nl = body.indexOf("\n");
    let lang = "", code = "";
    if (nl === -1) { lang = body.trim(); code = ""; }
    else { lang = body.slice(0, nl).trim(); code = body.slice(nl + 1); }
    segs.push({ type: "code", lang: lang, content: code, incomplete: false });
    i = afterStart + endIdx + 3;
  }
  return segs;
}

function fastTextRender(text) {
  if (!text) return "";
  let h = escapeHtml(text);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\n/g, "<br>");
  return h;
}

function buildFinalHTML(rawText, isStreaming) {
  const segs = buildSegments(rawText);
  let html = "";
  for (const seg of segs) {
    if (seg.type === "text") {
      html += isStreaming ? fastTextRender(seg.content) : renderMarkdown(seg.content);
    } else {
      const codeId = codeStorage.length;
      codeStorage.push(seg.content);
      const lang = (seg.lang || "code").toLowerCase();
      const isHtml = lang === "html" || lang === "htm" || lang === "xml" || seg.content.trim().startsWith("<!DOCTYPE") || seg.content.trim().startsWith("<html");
      if (isStreaming) {
        html += `<div class="code-container streaming"><div class="code-header"><span class="lang-tag">${escapeHtml(seg.lang || "code")}</span></div><pre><code class="language-${escapeHtml(lang)}">${escapeHtml(seg.content)}</code></pre></div>`;
      } else {
        html += `<div class="code-container" data-code-id="${codeId}">
          <div class="code-header">
            <span class="lang-tag">${escapeHtml(seg.lang || "code")}</span>
            <div class="code-actions">
              <button class="icon-btn" onclick="copyCode(${codeId}, this)">${ICONS.copy} Copiar</button>
              <button class="icon-btn" onclick="editCode(${codeId})">${ICONS.edit} Editar</button>
              <button class="icon-btn primary" onclick="runCode(${codeId})">${isHtml ? ICONS.play + ' Preview' : ICONS.play + ' Testar'}</button>
            </div>
          </div>
          <pre><code class="language-${escapeHtml(lang)}">${escapeHtml(seg.content)}</code></pre>
        </div>`;
      }
    }
  }
  return html;
}

let pendingRenderEl = null, pendingRenderText = null, renderScheduled = false;
function scheduleStreamRender(el, text) {
  pendingRenderEl = el;
  pendingRenderText = text;
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    if (!pendingRenderEl || pendingRenderText === null) return;
    const el2 = pendingRenderEl, txt = pendingRenderText;
    pendingRenderEl = null; pendingRenderText = null;
    el2.innerHTML = buildFinalHTML(txt, true) + '<span class="reasoning-cursor"></span>';
    scheduleScroll();
  });
}
let scrollScheduled = false;
function scheduleScroll(force) {
  if (force) { chatBox.scrollTop = chatBox.scrollHeight; return; }
  if (scrollScheduled) return;
  scrollScheduled = true;
  requestAnimationFrame(() => {
    scrollScheduled = false;
    const dist = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight;
    if (dist < 260) chatBox.scrollTop = chatBox.scrollHeight;
  });
}
function scrollChat(force) { scheduleScroll(force); }

function buildSharedHistory(currentUserText) {
  const chat = getCurrentChat();
  if (!chat) return [];
  let msgs = chat.messages.filter(m => !m.isImage && !m.isVideo && (m.text || "").trim());
  if (msgs.length && msgs[msgs.length - 1].role === "user" && msgs[msgs.length - 1].text === currentUserText) {
    msgs = msgs.slice(0, -1);
  }
  return msgs.slice(-MAX_HISTORY * 2);
}

async function generateTextStream(text, images, files) {
  const p = PROVIDERS[state.provider];
  const apiKey = getActiveKey();
  const info = getCurrentModelInfo();
  if (!apiKey) { showToast("Configure uma API key para " + p.name, "error"); return; }

  const botRow = document.createElement("div");
  botRow.className = "message-row bot";
  botRow.innerHTML = `<div class="avatar">${ICONS.bot}</div><div class="message-body"><div class="message-bubble"><div class="thinking-container">${ICONS.brain}<span>Conectando a ${escapeHtml(p.name)}...</span><span class="typing-dots"><i></i><i></i><i></i></span></div></div></div>`;
  chatBox.appendChild(botRow);
  scrollChat(true);

  const bubble = botRow.querySelector(".message-bubble");
  const fileNotes = (files || []).map(f => `[Arquivo: ${f.name} (${f.type})]`).join("\n");
  const isGopno = (state.model === "gopno");
  const systemPrompt = isGopno ? GOPNO_SYSTEM_PROMPT : DEFAULT_SYSTEM_PROMPT;
  const realModel = (info && info.realId) ? info.realId : state.model;

  const historyMsgs = buildSharedHistory(text);
  const userTextWithFiles = (text || "(sem texto)") + (fileNotes ? "\n\n" + fileNotes : "");

  let url = p.url, headers = p.headers(apiKey), body = null;

  if (state.provider === "gemini") {
    url = p.url.replace("{model}", state.model).replace("{key}", apiKey);
    const gParts = [{ text: userTextWithFiles }];
    images.forEach(im => {
      const m = im.dataUrl.match(/^data:(.+?);base64,(.+)$/);
      if (m) gParts.push({ inline_data: { mime_type: m[1], data: m[2] } });
    });
    const contents = historyMsgs.map(m => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.text || "" }]
    }));
    contents.push({ role: "user", parts: gParts });
    body = {
      contents,
      systemInstruction: { parts: [{ text: systemPrompt }] },
      generationConfig: { temperature: isGopno ? 1.0 : 0.7, maxOutputTokens: 8192 }
    };
  }
  else if (state.provider === "claude") {
    const cContent = [];
    images.forEach(im => {
      const m = im.dataUrl.match(/^data:(.+?);base64,(.+)$/);
      if (m) cContent.push({ type: "image", source: { type: "base64", media_type: m[1], data: m[2] } });
    });
    cContent.push({ type: "text", text: userTextWithFiles });

    const merged = [];
    historyMsgs.forEach(m => {
      const role = m.role === "assistant" ? "assistant" : "user";
      const content = (m.text || "").trim();
      if (!content) return;
      if (merged.length && merged[merged.length - 1].role === role) {
        merged[merged.length - 1].content += "\n\n" + content;
      } else {
        merged.push({ role, content });
      }
    });
    while (merged.length && merged[0].role === "assistant") merged.shift();
    if (merged.length && merged[merged.length - 1].role === "user") merged.pop();
    merged.push({ role: "user", content: cContent });

    body = { model: state.model, max_tokens: 8192, stream: true, system: systemPrompt, messages: merged };
  }
  else {
    let uContent;
    if (images.length > 0 && info && info.vision) {
      uContent = [{ type: "text", text: userTextWithFiles }];
      images.forEach(im => uContent.push({ type: "image_url", image_url: { url: im.dataUrl } }));
    } else {
      uContent = userTextWithFiles;
    }
    const hist = historyMsgs.map(m => ({ role: m.role, content: m.text }));
    body = {
      model: realModel,
      messages: [{ role: "system", content: systemPrompt }, ...hist, { role: "user", content: uContent }],
      temperature: isGopno ? 1.0 : 0.7, stream: true, max_tokens: 8192,
      stream_options: { include_usage: true }
    };
    if (info && info.reasoning && state.provider === "groq" && !isGopno) {
      body.reasoning_effort = "medium";
      body.include_reasoning = true;
    }
    if (state.provider === "openrouter") body.usage = { include: true };
  }

  const ctl = new AbortController();
  abortCtl = ctl;

  try {
    const res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body), signal: ctl.signal });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      const msg = (err.error && (err.error.message || err.error.type)) || ("Erro " + res.status);
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", reasoningText = "", answerText = "";
    let reasoningBox = null, reasoningBody = null, answerEl = null, firstChunk = true, usage = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        if (state.provider === "gemini") {
          if (!trimmed.startsWith("data: ")) continue;
          const data = trimmed.slice(6);
          if (data === "[DONE]") continue;
          try {
            const gj = JSON.parse(data);
            const cand = gj.candidates && gj.candidates[0];
            if (!cand) continue;
            const parts = (cand.content && cand.content.parts) || [];
            const chunk = parts.map(pp => pp.text || "").join("");
            if (gj.usageMetadata) usage = { prompt_tokens: gj.usageMetadata.promptTokenCount || 0, completion_tokens: gj.usageMetadata.candidatesTokenCount || 0, total_tokens: gj.usageMetadata.totalTokenCount || 0 };
            if (chunk) {
              if (firstChunk) { firstChunk = false; bubble.innerHTML = ""; answerEl = document.createElement("div"); bubble.appendChild(answerEl); }
              answerText += chunk;
              scheduleStreamRender(answerEl, answerText);
            }
          } catch (e) {}
          continue;
        }

        if (state.provider === "claude") {
          if (!trimmed.startsWith("data: ")) continue;
          const data = trimmed.slice(6);
          try {
            const cj = JSON.parse(data);
            if (cj.type === "content_block_delta" && cj.delta) {
              const txt = cj.delta.text || "";
              if (txt) {
                if (firstChunk) { firstChunk = false; bubble.innerHTML = ""; answerEl = document.createElement("div"); bubble.appendChild(answerEl); }
                answerText += txt;
                scheduleStreamRender(answerEl, answerText);
              }
            }
            if (cj.type === "message_start" && cj.message && cj.message.usage) {
              usage = { prompt_tokens: cj.message.usage.input_tokens || 0, completion_tokens: cj.message.usage.output_tokens || 0, total_tokens: (cj.message.usage.input_tokens || 0) + (cj.message.usage.output_tokens || 0) };
            }
            if (cj.type === "message_delta" && cj.usage) {
              if (!usage) usage = { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 };
              usage.completion_tokens = cj.usage.output_tokens || usage.completion_tokens;
              usage.total_tokens = usage.prompt_tokens + usage.completion_tokens;
            }
          } catch (e) {}
          continue;
        }

        if (!trimmed.startsWith("data: ")) continue;
        const data = trimmed.slice(6);
        if (data === "[DONE]") continue;
        try {
          const json = JSON.parse(data);
          if (json.usage) usage = json.usage;
          const delta = json.choices && json.choices[0] && json.choices[0].delta;
          if (!delta) continue;
          const reasoningChunk = delta.reasoning || delta.reasoning_content || "";
          const contentChunk = delta.content || "";
          if (firstChunk && (reasoningChunk || contentChunk)) {
            firstChunk = false;
            bubble.innerHTML = "";
            if (info && info.reasoning && !isGopno) {
              reasoningBox = document.createElement("div");
              reasoningBox.className = "reasoning-box";
              reasoningBox.innerHTML = `<div class="reasoning-header" onclick="toggleReasoning(this)">${ICONS.chevron}<span class="reasoning-title">${ICONS.brainSmall} Raciocínio do modelo</span></div><div class="reasoning-body"></div>`;
              bubble.appendChild(reasoningBox);
              reasoningBody = reasoningBox.querySelector(".reasoning-body");
            }
            answerEl = document.createElement("div");
            answerEl.className = "answer-text";
            answerEl.style.marginTop = (info && info.reasoning && !isGopno) ? "10px" : "0";
            bubble.appendChild(answerEl);
          }
          if (reasoningChunk && reasoningBody) {
            reasoningText += reasoningChunk;
            reasoningBody.innerHTML = escapeHtml(reasoningText) + '<span class="reasoning-cursor"></span>';
            if (reasoningBody.scrollHeight > 400) reasoningBody.scrollTop = reasoningBody.scrollHeight;
          }
          if (contentChunk && answerEl) {
            answerText += contentChunk;
            scheduleStreamRender(answerEl, answerText);
          }
        } catch (e) {}
      }
    }

    if (answerEl) {
      answerEl.innerHTML = buildFinalHTML(answerText, false);
      applyHighlight(answerEl);
    }
    addMetaToBubble(bubble, answerText, usage, info ? info.name : null);

    addMessageToCurrentChat({
      role: "assistant", text: answerText, usage,
      modelName: info ? info.name : null,
      timestamp: Date.now()
    });

  } catch (err) {
    if (err.name === "AbortError") return;
    bubble.innerHTML = `<div class="thinking-container" style="color:#fca5a5;">${ICONS.alert}<span>${escapeHtml(err.message)}</span></div>`;
    botRow.classList.add("error");
    addMessageToCurrentChat({ role: "assistant", text: "Erro: " + err.message, isError: true, timestamp: Date.now() });
  } finally {
    abortCtl = null;
  }
}

function toggleReasoning(header) {
  header.classList.toggle("collapsed");
  const body = header.nextElementSibling;
  if (body) body.classList.toggle("collapsed");
}

function buildPollinationsImageUrls(prompt, model, seed) {
  const p = encodeURIComponent(prompt);
  const t = Date.now();
  const m = model || "flux";
  const list = [
    `https://image.pollinations.ai/prompt/${p}?width=1024&height=1024&nologo=true&model=${m}&seed=${seed}&t=${t}`,
    `https://image.pollinations.ai/prompt/${p}?width=1024&height=1024&nologo=true&seed=${seed}&t=${t}`,
    `https://image.pollinations.ai/prompt/${p}?width=768&height=768&nologo=true&model=turbo&seed=${seed}&t=${t}`,
    `https://image.pollinations.ai/prompt/${p}?width=512&height=512&nologo=true&t=${t}`
  ];
  return list;
}

async function generateImage(prompt, model) {
  const botRow = document.createElement("div");
  botRow.className = "message-row bot";
  botRow.innerHTML = `<div class="avatar">${ICONS.bot}</div><div class="message-body"><div class="message-bubble"></div></div>`;
  chatBox.appendChild(botRow);
  const bubble = botRow.querySelector(".message-bubble");

  let cleaned = prompt
    .replace(/\b(crie|gere|desenhe|gerar|faz|faça|uma|um|de|do|da|para|com|por|favor|the|a|an|image|imagem|picture|photo|art)\b/gi, "")
    .replace(/\s+/g, " ").trim();
  if (!cleaned) cleaned = prompt;

  const seed = Math.floor(Math.random() * 9999999);
  const modelId = model || "flux";
  const modelInfo = IMAGE_MODELS.find(m => m.id === modelId) || IMAGE_MODELS[0];
  const urls = buildPollinationsImageUrls(cleaned, modelId, seed);
  const cleanedSafe = escapeHtml(cleaned).replace(/'/g, "&#39;");

  bubble.innerHTML = `
    <div class="thinking-container" style="margin-bottom:10px;">
      ${ICONS.image}<span>Renderizando com ${escapeHtml(modelInfo.name)}…</span>
      <span class="typing-dots"><i></i><i></i><i></i></span>
    </div>
    <div class="img-wrap">
      <img src="${urls[0]}" class="img-generated" alt="Imagem Gerada">
      <div class="img-overlay">
        <button class="img-action" onclick="regenImage(this, '${cleanedSafe}', '${modelId}')" title="Regenerar">${ICONS.refresh}</button>
        <button class="img-action" data-imgurl="${urls[0]}" onclick="downloadImage(this.dataset.imgurl)" title="Baixar">${ICONS.download}</button>
        <a href="${urls[0]}" target="_blank" rel="noopener" class="img-action" title="Abrir">${ICONS.expand}</a>
      </div>
    </div>
    <div class="msg-meta">
      <span class="meta-stats">
        <span class="token-chip model">${ICONS.image} ${escapeHtml(modelInfo.name)}</span>
        <span class="token-chip cost">Sem marca d'água</span>
      </span>
    </div>
  `;

  const img = bubble.querySelector(".img-generated");
  const wrap = bubble.querySelector(".img-wrap");
  let attempt = 0;
  let loaded = false;
  let timeoutId = null;

  const tryNext = () => {
    attempt++;
    if (attempt >= urls.length) {
      clearTimeout(timeoutId);
      wrap.style.animation = "none";
      wrap.style.background = "rgba(69,26,26,.3)";
      wrap.style.minHeight = "auto";
      wrap.innerHTML = `
        <div style="padding:24px;text-align:center;color:#fca5a5;font-size:.85rem;">
          <b>Não foi possível carregar a imagem</b><br>
          <span style="color:var(--text-2);font-size:.78rem;display:block;margin-top:6px;">Tente novamente ou troque o modelo.</span>
          <button class="icon-btn primary" style="margin-top:12px;" onclick="regenImage(this, '${cleanedSafe}', '${modelId}')">${ICONS.refresh} Tentar novamente</button>
        </div>`;
      return;
    }
    img.src = urls[attempt];
  };

  img.addEventListener("load", () => {
    if (!img.naturalWidth || img.naturalWidth < 10) { tryNext(); return; }
    loaded = true;
    clearTimeout(timeoutId);
    img.classList.add("loaded");
    wrap.style.animation = "none";
    wrap.style.background = "transparent";
    wrap.style.minHeight = "auto";
    scrollChat();
    const dlBtn = bubble.querySelector('[data-imgurl]');
    if (dlBtn) dlBtn.dataset.imgurl = img.src;
    const openLink = bubble.querySelector('a.img-action');
    if (openLink) openLink.href = img.src;
    addMessageToCurrentChat({ role: "assistant", text: prompt, isImage: true, imageUrl: img.src, modelName: modelInfo.name, timestamp: Date.now() });
  });

  img.addEventListener("error", () => {
    if (!loaded) tryNext();
  });

  timeoutId = setTimeout(() => {
    if (!loaded) tryNext();
  }, 30000);

  scrollChat();
}

function regenImage(btn, prompt, model) {
  const wrap = btn.closest(".message-bubble");
  if (!wrap) return;
  const newSeed = Math.floor(Math.random() * 9999999);
  const urls = buildPollinationsImageUrls(prompt, model, newSeed);
  const imgWrap = wrap.querySelector(".img-wrap");
  if (!imgWrap) return;
  imgWrap.style.animation = "shimmer 1.5s linear infinite";
  imgWrap.style.background = "linear-gradient(110deg, #0f172a 25%, #1e293b 50%, #0f172a 75%)";
  imgWrap.style.backgroundSize = "220% 100%";
  imgWrap.style.minHeight = "200px";
  imgWrap.innerHTML = `<img src="${urls[0]}" class="img-generated" alt="Imagem Gerada">`;
  const newImg = imgWrap.querySelector(".img-generated");
  newImg.addEventListener("load", () => {
    if (!newImg.naturalWidth || newImg.naturalWidth < 10) return;
    newImg.classList.add("loaded");
    imgWrap.style.animation = "none";
    imgWrap.style.background = "transparent";
    imgWrap.style.minHeight = "auto";
  });
  showToast("Regenerando imagem...", "info");
}

async function generateVideo(prompt, videoModelId) {
  const botRow = document.createElement("div");
  botRow.className = "message-row bot";
  botRow.innerHTML = `<div class="avatar">${ICONS.bot}</div><div class="message-body"><div class="message-bubble"></div></div>`;
  chatBox.appendChild(botRow);
  const bubble = botRow.querySelector(".message-bubble");

  const vm = VIDEO_MODELS.find(m => m.id === videoModelId) || VIDEO_MODELS[0];

  bubble.innerHTML = `
    <div class="thinking-container" style="margin-bottom:10px;">
      ${ICONS.film}<span>Gerando vídeo com ${escapeHtml(vm.name)}…</span>
      <span class="typing-dots"><i></i><i></i><i></i></span>
    </div>
    <div class="video-wrap" id="video-wrap-${Date.now()}">
      <div style="padding:40px 20px;text-align:center;">
        ${ICONS.film}
        <div class="video-status" id="vstatus">${escapeHtml(vm.desc || "Processando…")}</div>
        <div class="video-progress-bar"><div class="video-progress-fill" id="vprog"></div></div>
      </div>
    </div>
    <div class="msg-meta">
      <span class="meta-stats">
        <span class="token-chip model">${ICONS.film} ${escapeHtml(vm.name)}</span>
        <span class="token-chip cost">Grátis</span>
      </span>
    </div>
  `;

  const statusEl = bubble.querySelector("#vstatus");
  const progEl = bubble.querySelector("#vprog");
  const videoWrap = bubble.querySelector(".video-wrap");
  let progValue = 5;
  progEl.style.width = "5%";

  const progInterval = setInterval(() => {
    progValue += Math.random() * 4;
    if (progValue > 92) progValue = 92;
    progEl.style.width = progValue + "%";
  }, 800);

  try {
    let videoUrl = null;

    if (vm.provider === "puter") {
      if (typeof puter === "undefined" || !puter.ai || !puter.ai.txt2vid) {
        throw new Error("Puter.js não carregou. Verifique sua conexão.");
      }
      statusEl.textContent = "Enviando para " + vm.name + "…";
      const videoElement = await puter.ai.txt2vid(prompt, { model: vm.model });
      if (videoElement && videoElement.src) {
        videoUrl = videoElement.src;
      } else if (videoElement && videoElement.tagName === "VIDEO") {
        videoUrl = videoElement.querySelector("source")?.src || videoElement.src;
      } else if (typeof videoElement === "string") {
        videoUrl = videoElement;
      }
      if (!videoUrl) throw new Error("Puter não retornou URL de vídeo");
    } else if (vm.provider === "pollinations") {
      statusEl.textContent = "Gerando via Pollinations (" + vm.name + ")…";
      const p = encodeURIComponent(prompt);
      const t = Date.now();
      const seed = Math.floor(Math.random() * 9999999);
      const pollUrl = `https://gen.pollinations.ai/video/${p}?model=${vm.model}&duration=${vm.duration || 5}&seed=${seed}&t=${t}`;
      videoUrl = pollUrl;
    }

    clearInterval(progInterval);
    progEl.style.width = "100%";
    statusEl.textContent = "Pronto!";

    if (videoUrl) {
      videoWrap.classList.add("loaded");
      videoWrap.innerHTML = `
        <video src="${videoUrl}" controls playsinline preload="metadata" style="width:100%;display:block;background:#000;">
          Seu navegador não suporta o elemento video.
        </video>
        <div class="video-overlay">
          <button class="img-action" data-videourl="${videoUrl}" onclick="downloadVideo(this.dataset.videourl)" title="Baixar">${ICONS.download}</button>
          <a href="${videoUrl}" target="_blank" rel="noopener" class="img-action" title="Abrir">${ICONS.expand}</a>
        </div>`;
      addMessageToCurrentChat({ role: "assistant", text: prompt, isVideo: true, videoUrl: videoUrl, modelName: vm.name, timestamp: Date.now() });
      scrollChat();
    }
  } catch (err) {
    clearInterval(progInterval);
    videoWrap.style.animation = "none";
    videoWrap.style.background = "rgba(69,26,26,.3)";
    videoWrap.innerHTML = `
      <div style="padding:24px;text-align:center;color:#fca5a5;font-size:.85rem;">
        <b>Erro ao gerar vídeo</b><br>
        <span style="color:var(--text-2);font-size:.78rem;display:block;margin-top:6px;">${escapeHtml(err.message || "Tente outro modelo ou tente novamente.")}</span>
      </div>`;
    botRow.classList.add("error");
    addMessageToCurrentChat({ role: "assistant", text: "Erro no vídeo: " + (err.message || ""), isError: true, timestamp: Date.now() });
  }
}

function copyToClipboard(text, onSuccess, onError) {
  text = String(text == null ? "" : text);
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.top = "0";
  ta.style.left = "0";
  ta.style.width = "2em";
  ta.style.height = "2em";
  ta.style.padding = "0";
  ta.style.border = "none";
  ta.style.outline = "none";
  ta.style.boxShadow = "none";
  ta.style.background = "transparent";
  ta.style.opacity = "0";
  ta.style.fontSize = "16px";
  document.body.appendChild(ta);

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  if (isIOS) {
    ta.contentEditable = "true";
    ta.readOnly = false;
    const range = document.createRange();
    range.selectNodeContents(ta);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    ta.setSelectionRange(0, 999999);
  } else {
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
  }

  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  document.body.removeChild(ta);

  if (ok) {
    if (onSuccess) onSuccess();
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).catch(() => {});
    }
  } else {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => onSuccess && onSuccess()).catch(() => {
        if (onError) onError();
        else showToast("Não foi possível copiar. Selecione manualmente.", "warning");
      });
    } else {
      if (onError) onError();
      else showToast("Não foi possível copiar. Selecione manualmente.", "warning");
    }
  }
}

function speakText(button) {
  const text = textStorage[button.dataset.tid];
  if (!text) return;
  if (!("speechSynthesis" in window)) { showToast("Síntese de voz não suportada", "error"); return; }
  if (button.classList.contains("speaking")) { window.speechSynthesis.cancel(); button.classList.remove("speaking"); currentSpeakBtn = null; return; }
  window.speechSynthesis.cancel();
  if (currentSpeakBtn) currentSpeakBtn.classList.remove("speaking");
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "pt-BR"; utterance.rate = 1.0;
  button.classList.add("speaking"); currentSpeakBtn = button;
  utterance.onend = () => { button.classList.remove("speaking"); if (currentSpeakBtn === button) currentSpeakBtn = null; };
  utterance.onerror = () => { button.classList.remove("speaking"); if (currentSpeakBtn === button) currentSpeakBtn = null; };
  const applyVoice = () => {
    const voices = window.speechSynthesis.getVoices();
    const pt = voices.find(v => v.lang.toLowerCase().startsWith("pt"));
    if (pt) utterance.voice = pt;
    window.speechSynthesis.speak(utterance);
  };
  if (window.speechSynthesis.getVoices().length) applyVoice();
  else { window.speechSynthesis.onvoiceschanged = applyVoice; setTimeout(() => { if (!window.speechSynthesis.speaking) applyVoice(); }, 220); }
}

function escapeHtml(str) {
  return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
function renderMarkdown(text) {
  let html = escapeHtml(text);
  html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  html = html.replace(/^#### (.+)$/gm, "<h4>$1</h4>");
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, "<em>$1</em>");
  html = html.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/^---+$/gm, "<hr>");
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = html.split("\n");
  const out = []; let inUl = false, inOl = false;
  lines.forEach(line => {
    if (/^\s*[-*+] (.+)$/.test(line)) {
      if (!inUl) { if (inOl) { out.push("</ol>"); inOl = false; } out.push("<ul>"); inUl = true; }
      out.push("<li>" + line.replace(/^\s*[-*+] /, "") + "</li>");
    } else if (/^\s*\d+\. (.+)$/.test(line)) {
      if (!inOl) { if (inUl) { out.push("</ul>"); inUl = false; } out.push("<ol>"); inOl = true; }
      out.push("<li>" + line.replace(/^\s*\d+\. /, "") + "</li>");
    } else {
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (inOl) { out.push("</ol>"); inOl = false; }
      out.push(line);
    }
  });
  if (inUl) out.push("</ul>");
  if (inOl) out.push("</ol>");
  html = out.join("\n");
  html = html.split(/\n{2,}/).map(b => {
    b = b.trim(); if (!b) return "";
    if (/^<(h[1-4]|ul|ol|blockquote|pre|hr|div)/.test(b)) return b;
    return "<p>" + b.replace(/\n/g, "<br>") + "</p>";
  }).join("\n");
  return html;
}
